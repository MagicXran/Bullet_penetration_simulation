<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算结果 - LS-DYNA仿真系统</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 共享样式表 -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            padding-top: 20px;
            padding-bottom: 40px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .status-card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .param-table th {
            background-color: #f8fafc;
            font-weight: 600;
        }
        .result-section {
            display: none;
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .animation-input-group {
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="main-container px-3">
        <!-- 任务头部 -->
        <div class="task-header">
            <h2 class="mb-3">
                <i class="bi bi-graph-up-arrow"></i>
                计算结果
            </h2>
            <p class="mb-2">
                <strong>任务ID:</strong> <span id="taskIdDisplay">加载中...</span>
            </p>
            <p class="mb-0 small opacity-75" id="taskStatus">
                正在查询任务状态...
            </p>
        </div>

        <!-- 状态卡片 -->
        <div class="card status-card" id="statusCard">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="spinner-border text-primary me-3 pulse" role="status" id="statusSpinner">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <div class="flex-grow-1">
                        <h5 class="card-title mb-1" id="statusTitle">正在加载任务信息...</h5>
                        <p class="card-text text-muted mb-0" id="statusDescription">
                            请稍候...
                        </p>
                    </div>
                    <div>
                        <span class="badge bg-secondary" id="statusBadge">加载中</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 错误信息 -->
        <div class="alert alert-danger d-none" id="errorAlert">
            <h6 class="alert-heading">
                <i class="bi bi-exclamation-triangle-fill"></i>
                执行失败
            </h6>
            <p class="mb-0" id="errorMessage"></p>
        </div>

        <!-- 输入参数 -->
        <div class="card mb-4" id="paramsSection">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-sliders"></i>
                    输入参数
                </h5>
            </div>
            <div class="card-body">
                <table class="table table-bordered param-table mb-0">
                    <thead>
                        <tr>
                            <th>参数名称</th>
                            <th>数值</th>
                            <th>单位</th>
                        </tr>
                    </thead>
                    <tbody id="paramsTableBody">
                        <tr>
                            <td colspan="3" class="text-center text-muted">暂无数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 结果文件 -->
        <div class="card mb-4 result-section" id="resultSection">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    <i class="bi bi-file-earmark-check-fill"></i>
                    生成结果
                </h5>
            </div>
            <div class="card-body">
                <p class="mb-3">
                    <strong>输出文件:</strong>
                    <span id="outputFilePath" class="text-muted">-</span>
                </p>
                <p class="mb-3">
                    <strong>完成时间:</strong>
                    <span id="completeTime" class="text-muted">-</span>
                </p>
                <div class="download-btn-group">
                    <button class="btn btn-primary btn-lg" id="downloadBtn" onclick="downloadResult()">
                        <i class="bi bi-download"></i>
                        下载K文件
                    </button>
                    <button class="btn btn-outline-primary" id="downloadMetaBtn" onclick="downloadMetadata()">
                        <i class="bi bi-file-text"></i>
                        下载元数据 (JSON)
                    </button>
                </div>
            </div>
        </div>

        <!-- 动画生成区域 -->
        <div class="card mb-4 result-section" id="animationSection">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0">
                    <i class="bi bi-film"></i>
                    仿真动画预览
                </h5>
            </div>
            <div class="card-body">
                <div id="animationPreview" class="animation-preview mb-3">
                    <div class="text-center text-muted">
                        <i class="bi bi-play-circle" style="font-size: 3rem;"></i>
                        <p class="mt-2 mb-0">运行LS-DYNA仿真后，输入d3plot路径生成云图动画</p>
                    </div>
                </div>

                <div class="animation-input-group">
                    <label class="form-label"><strong>d3plot文件路径</strong></label>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="d3plotPathInput"
                               placeholder="例如: D:\Simulations\d3plot">
                        <button class="btn btn-primary" id="generateAnimBtn" onclick="generateAnimation()">
                            <i class="bi bi-play-circle"></i> 生成动画
                        </button>
                    </div>
                    <div class="form-text text-muted">
                        <i class="bi bi-info-circle"></i>
                        需要先运行LS-DYNA仿真得到d3plot文件，然后才能生成云图动画
                    </div>
                </div>

                <!-- 动画任务状态 -->
                <div id="animationTaskStatus" class="mt-3" style="display: none;">
                    <div class="alert alert-info">
                        <div class="d-flex align-items-center">
                            <span class="spinner-border spinner-border-sm me-2" id="animSpinner"></span>
                            <span id="animStatusText">正在生成动画...</span>
                        </div>
                        <div class="progress mt-2" style="height: 5px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated"
                                 id="animProgressBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- 动画结果 -->
                <div id="animationResult" class="mt-3" style="display: none;">
                    <div class="text-center">
                        <img id="animationGif" src="" alt="仿真动画"
                             style="max-width: 100%; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    </div>
                    <div class="d-flex gap-2 justify-content-center mt-3">
                        <button class="btn btn-primary" onclick="downloadAnimation()">
                            <i class="bi bi-download"></i> 下载动画
                        </button>
                        <button class="btn btn-outline-secondary" onclick="resetAnimation()">
                            <i class="bi bi-arrow-clockwise"></i> 重新生成
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="d-flex gap-2 mb-4">
            <a href="index.html" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>
                返回首页
            </a>
            <button class="btn btn-outline-primary" id="refreshBtn" onclick="loadTaskStatus()">
                <i class="bi bi-arrow-clockwise"></i>
                刷新状态
            </button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentTaskId = null;
        let pollingInterval = null;
        let animationTaskId = null;
        let animationPollingInterval = null;

        // 状态映射
        const STATUS_MAP = {
            0: { name: '待执行', badge: 'secondary', class: 'status-pending' },
            1: { name: '排队中', badge: 'warning', class: 'status-pending' },
            2: { name: '执行中', badge: 'primary', class: 'status-running' },
            3: { name: '已完成', badge: 'success', class: 'status-completed' },
            4: { name: '已失败', badge: 'danger', class: 'status-failed' },
            5: { name: '已中止', badge: 'dark', class: 'status-failed' }
        };

        // 当前队列位置（用于状态1显示）
        let currentQueuePosition = null;

        // 获取URL参数
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // 渲染参数表格
        function renderParams(params) {
            const tbody = document.getElementById('paramsTableBody');
            const rows = [
                { name: '弹丸初速度', value: params.velocity_z, unit: 'm/s' },
                { name: '弹丸屈服强度', value: params.bullet_yield_stress, unit: 'MPa' },
                { name: '靶板屈服强度', value: params.target_yield_stress, unit: 'MPa' },
                { name: '静摩擦系数', value: params.friction_static, unit: '-' },
                { name: '动摩擦系数', value: params.friction_dynamic, unit: '-' },
                { name: '仿真终止时间', value: params.simulation_endtime, unit: 'µs' }
            ];

            tbody.innerHTML = rows.map(row => `
                <tr>
                    <td>${row.name}</td>
                    <td><strong>${row.value}</strong></td>
                    <td>${row.unit}</td>
                </tr>
            `).join('');
        }

        // 更新状态显示
        function updateStatusDisplay(task) {
            const status = task.status;
            const statusInfo = STATUS_MAP[status] || { name: '未知', badge: 'secondary', class: '' };

            // 更新状态卡片样式
            const statusCard = document.getElementById('statusCard');
            statusCard.className = `card status-card ${statusInfo.class}`;

            // 更新状态徽章
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.className = `badge bg-${statusInfo.badge}`;
            statusBadge.textContent = statusInfo.name;

            // 更新标题和描述
            const statusTitle = document.getElementById('statusTitle');
            const statusDescription = document.getElementById('statusDescription');
            const statusSpinner = document.getElementById('statusSpinner');

            switch (status) {
                case 0:
                    statusTitle.textContent = '参数已保存';
                    statusDescription.textContent = '等待平台触发执行，您可以关闭此页面稍后再来查看。';
                    statusSpinner.style.display = 'none';
                    break;
                case 1:
                    statusTitle.textContent = '排队等待中';
                    const queueMsg = currentQueuePosition
                        ? `当前排队位置: 第 ${currentQueuePosition} 位`
                        : '任务已加入执行队列...';
                    statusDescription.textContent = queueMsg;
                    statusSpinner.style.display = 'block';
                    break;
                case 2:
                    statusTitle.textContent = '正在执行';
                    statusDescription.textContent = 'K文件正在生成，请稍候...';
                    statusSpinner.style.display = 'block';
                    break;
                case 3:
                    statusTitle.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> 计算完成';
                    statusDescription.textContent = 'K文件已成功生成，可以下载了！';
                    statusSpinner.style.display = 'none';
                    document.getElementById('resultSection').style.display = 'block';
                    document.getElementById('animationSection').style.display = 'block';
                    stopPolling();
                    break;
                case 4:
                    statusTitle.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> 计算失败';
                    statusDescription.textContent = '任务执行过程中发生错误';
                    statusSpinner.style.display = 'none';
                    document.getElementById('errorAlert').classList.remove('d-none');
                    document.getElementById('errorMessage').textContent = task.error_message || '未知错误';
                    stopPolling();
                    break;
                case 5:
                    statusTitle.textContent = '任务已中止';
                    statusDescription.textContent = '任务被手动中止';
                    statusSpinner.style.display = 'none';
                    stopPolling();
                    break;
            }

            // 更新头部状态
            document.getElementById('taskStatus').textContent = `当前状态：${statusInfo.name}`;
        }

        // 加载任务状态
        async function loadTaskStatus() {
            if (!currentTaskId) {
                alert('错误：缺少task_id参数');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/task/${currentTaskId}`);

                if (response.status === 404) {
                    // 任务不存在 → 停留在当前页面，显示明显错误提示
                    const statusCard = document.getElementById('statusCard');
                    statusCard.className = 'card status-card status-failed';

                    document.getElementById('statusSpinner').style.display = 'none';
                    document.getElementById('statusTitle').innerHTML =
                        '<i class="bi bi-exclamation-triangle-fill text-danger"></i> 任务不存在';
                    document.getElementById('statusDescription').textContent =
                        '未找到该任务ID对应的记录，请检查任务ID是否正确，或返回首页创建新任务。';
                    document.getElementById('statusBadge').className = 'badge bg-danger';
                    document.getElementById('statusBadge').textContent = '不存在';
                    document.getElementById('taskStatus').textContent = '状态：任务不存在';

                    // 隐藏参数区域
                    document.getElementById('paramsSection').style.display = 'none';

                    stopPolling();
                    return;
                }

                if (!response.ok) {
                    throw new Error('查询任务失败');
                }

                const task = await response.json();

                // 显示参数
                if (task.input_params) {
                    renderParams(task.input_params);
                }

                // 如果状态是排队中，尝试获取队列位置
                if (task.status === 1) {
                    try {
                        const queueResp = await fetch(`${API_BASE}/queue/status`);
                        if (queueResp.ok) {
                            const queueData = await queueResp.json();
                            // 从队列中找到当前任务的位置
                            if (queueData.queued_tasks && Array.isArray(queueData.queued_tasks)) {
                                const item = queueData.queued_tasks.find(t => t.task_id === currentTaskId);
                                currentQueuePosition = item ? item.position : null;
                            }
                        }
                    } catch (e) {
                        console.warn('获取队列位置失败:', e);
                    }
                }

                // 更新状态显示
                updateStatusDisplay(task);

                // 根据状态调整轮询策略
                if (task.status === 1 || task.status === 2) {
                    startPolling(task.status);
                } else if (task.status === 0) {
                    stopPolling(); // 状态0不轮询
                }

                // 如果已完成，显示结果
                if (task.status === 3 && task.output_file_path) {
                    document.getElementById('outputFilePath').textContent = task.output_file_path;
                    document.getElementById('completeTime').textContent = task.end_time || '-';

                    // 提取文件名用于下载
                    const filename = task.output_file_path.split('\\').pop().split('/').pop();
                    document.getElementById('downloadBtn').setAttribute('data-filename', filename);
                }

            } catch (error) {
                console.error('加载任务状态失败:', error);
                alert('加载任务状态失败: ' + error.message);
            }
        }

        // 开始轮询（智能轮询：状态0不轮询，状态1-2才轮询）
        function startPolling(status) {
            // 状态0：不自动轮询，用户可手动刷新
            if (status === 0) {
                stopPolling();
                return;
            }

            // 状态1或2：开始轮询
            if (pollingInterval) return;

            const interval = (status === 1) ? 5000 : 2000; // 排队5秒，执行中2秒
            pollingInterval = setInterval(async () => {
                await loadTaskStatus();
            }, interval);
        }

        // 停止轮询
        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        // 下载结果文件
        function downloadResult() {
            const btn = document.getElementById('downloadBtn');
            const filename = btn.getAttribute('data-filename');

            if (!filename) {
                alert('文件名未找到');
                return;
            }

            const url = `${API_BASE}/download/${filename}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 下载元数据
        function downloadMetadata() {
            const btn = document.getElementById('downloadBtn');
            const filename = btn.getAttribute('data-filename');

            if (!filename) {
                alert('文件名未找到');
                return;
            }

            const metaFilename = filename.replace('.k', '_metadata.json');
            const url = `${API_BASE}/download/${metaFilename}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = metaFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 生成动画
        async function generateAnimation() {
            const d3plotPath = document.getElementById('d3plotPathInput').value.trim();
            if (!d3plotPath) {
                alert('请输入d3plot文件路径');
                return;
            }

            const btn = document.getElementById('generateAnimBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 创建中...';

            try {
                const response = await fetch(`${API_BASE}/animation/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        d3plot_path: d3plotPath,
                        view: 'isometric',
                        fringe_variable: 'stress',
                        resolution: [1920, 1080],
                        output_format: 'gif',
                        show_all_parts: true,
                        show_legend: true,
                        show_triad: true
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '创建动画任务失败');
                }

                const task = await response.json();
                animationTaskId = task.task_id;

                // 显示进度
                document.getElementById('animationPreview').style.display = 'none';
                document.getElementById('animationTaskStatus').style.display = 'block';
                document.getElementById('animationResult').style.display = 'none';

                // 开始轮询动画任务状态
                startAnimationPolling();

            } catch (error) {
                alert('生成动画失败: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-play-circle"></i> 生成动画';
            }
        }

        // 轮询动画任务状态
        function startAnimationPolling() {
            if (animationPollingInterval) return;

            animationPollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/animation/status/${animationTaskId}`);
                    if (!response.ok) throw new Error('查询状态失败');

                    const task = await response.json();

                    // 更新进度
                    document.getElementById('animProgressBar').style.width = `${task.progress}%`;
                    document.getElementById('animStatusText').textContent =
                        `正在生成动画... ${task.progress}%`;

                    if (task.status === 'completed') {
                        stopAnimationPolling();
                        showAnimationResult();
                    } else if (task.status === 'failed') {
                        stopAnimationPolling();
                        alert('动画生成失败: ' + (task.error_message || '未知错误'));
                        resetAnimation();
                    }
                } catch (error) {
                    console.error('轮询动画状态失败:', error);
                    stopAnimationPolling();
                }
            }, 3000);
        }

        function stopAnimationPolling() {
            if (animationPollingInterval) {
                clearInterval(animationPollingInterval);
                animationPollingInterval = null;
            }
        }

        function showAnimationResult() {
            document.getElementById('animationTaskStatus').style.display = 'none';
            document.getElementById('animationResult').style.display = 'block';

            // 设置动画图片
            const animGif = document.getElementById('animationGif');
            animGif.src = `${API_BASE}/animation/download/${animationTaskId}`;
        }

        function downloadAnimation() {
            if (!animationTaskId) return;
            const url = `${API_BASE}/animation/download/${animationTaskId}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = `animation_${animationTaskId.substring(0, 8)}.gif`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function resetAnimation() {
            animationTaskId = null;
            document.getElementById('animationPreview').style.display = 'flex';
            document.getElementById('animationTaskStatus').style.display = 'none';
            document.getElementById('animationResult').style.display = 'none';
            document.getElementById('animProgressBar').style.width = '0%';
        }

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', async function() {
            // 获取task_id
            currentTaskId = getQueryParam('task_id');

            if (!currentTaskId) {
                alert('错误：缺少task_id参数');
                document.getElementById('taskIdDisplay').textContent = '未提供';
                return;
            }

            // 显示task_id
            document.getElementById('taskIdDisplay').textContent = currentTaskId;

            // 加载任务状态（会根据状态自动决定是否开始轮询）
            await loadTaskStatus();
        });

        // 页面卸载时停止轮询
        window.addEventListener('beforeunload', function() {
            stopPolling();
            stopAnimationPolling();
        });
    </script>
</body>
</html>
