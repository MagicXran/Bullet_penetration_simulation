<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS-DYNA 子弹穿透仿真参数化系统</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-3 bg-light sidebar">
                <div class="p-3">
                    <h4 class="mb-4">
                        <i class="bi bi-gear-fill text-primary"></i>
                        LS-DYNA 参数化
                    </h4>
                    <p class="text-muted small">
                        子弹穿透仿真参数配置系统 v1.0
                    </p>

                    <hr>

                    <div class="mb-3">
                        <h6>快速预设</h6>
                        <select class="form-select form-select-sm" id="presetSelector">
                            <option value="">选择预设场景...</option>
                            <option value="default">标准配置</option>
                            <option value="low_speed">低速冲击</option>
                            <option value="high_speed">高速穿甲</option>
                            <option value="soft_target">软钢靶板</option>
                            <option value="hard_target">装甲钢靶板</option>
                        </select>
                    </div>

                    <hr>

                    <div id="validationSummary" class="alert alert-info small d-none">
                        <i class="bi bi-info-circle"></i>
                        <span id="validationMessage">参数验证中...</span>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-9">
                <div class="p-4">
                    <h2 class="mb-4">仿真参数配置</h2>

                    <!-- 参数表单 -->
                    <form id="paramForm">
                        <div class="row">
                            <!-- 参数1：弹丸初速度 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <label for="velocity_z" class="form-label">
                                            <i class="bi bi-speedometer2 text-primary"></i>
                                            <strong>弹丸初速度</strong>
                                        </label>
                                        <div class="input-group">
                                            <input type="number"
                                                   class="form-control"
                                                   id="velocity_z"
                                                   name="velocity_z"
                                                   value="1600"
                                                   min="500"
                                                   max="3000"
                                                   step="50"
                                                   required>
                                            <span class="input-group-text">m/s</span>
                                        </div>
                                        <div class="form-text">
                                            推荐范围: 500-3000 m/s
                                        </div>
                                        <div class="invalid-feedback" id="velocity_z_error"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 参数2：弹丸屈服强度 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <label for="bullet_yield_stress" class="form-label">
                                            <i class="bi bi-circle-fill text-warning"></i>
                                            <strong>弹丸屈服强度</strong>
                                        </label>
                                        <div class="input-group">
                                            <input type="number"
                                                   class="form-control"
                                                   id="bullet_yield_stress"
                                                   name="bullet_yield_stress"
                                                   value="1000"
                                                   min="500"
                                                   max="2000"
                                                   step="100"
                                                   required>
                                            <span class="input-group-text">MPa</span>
                                        </div>
                                        <div class="form-text">
                                            推荐范围: 500-2000 MPa
                                        </div>
                                        <div class="invalid-feedback" id="bullet_yield_stress_error"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 参数3：靶板屈服强度 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <label for="target_yield_stress" class="form-label">
                                            <i class="bi bi-shield-fill text-success"></i>
                                            <strong>靶板屈服强度</strong>
                                        </label>
                                        <div class="input-group">
                                            <input type="number"
                                                   class="form-control"
                                                   id="target_yield_stress"
                                                   name="target_yield_stress"
                                                   value="800"
                                                   min="200"
                                                   max="1200"
                                                   step="100"
                                                   required>
                                            <span class="input-group-text">MPa</span>
                                        </div>
                                        <div class="form-text">
                                            推荐范围: 200-1200 MPa
                                        </div>
                                        <div class="invalid-feedback" id="target_yield_stress_error"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 参数4：静摩擦系数 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <label for="friction_static" class="form-label">
                                            <i class="bi bi-grip-horizontal text-danger"></i>
                                            <strong>静摩擦系数</strong>
                                        </label>
                                        <div class="input-group">
                                            <input type="number"
                                                   class="form-control"
                                                   id="friction_static"
                                                   name="friction_static"
                                                   value="0.25"
                                                   min="0"
                                                   max="0.8"
                                                   step="0.05"
                                                   required>
                                            <span class="input-group-text">-</span>
                                        </div>
                                        <div class="form-text">
                                            推荐范围: 0.0-0.8
                                        </div>
                                        <div class="invalid-feedback" id="friction_static_error"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 参数5：动摩擦系数 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <label for="friction_dynamic" class="form-label">
                                            <i class="bi bi-arrow-right-circle text-info"></i>
                                            <strong>动摩擦系数</strong>
                                        </label>
                                        <div class="input-group">
                                            <input type="number"
                                                   class="form-control"
                                                   id="friction_dynamic"
                                                   name="friction_dynamic"
                                                   value="0.18"
                                                   min="0"
                                                   max="0.6"
                                                   step="0.05"
                                                   required>
                                            <span class="input-group-text">-</span>
                                        </div>
                                        <div class="form-text">
                                            推荐范围: 0.0-0.6 (通常为静摩擦的60-80%)
                                        </div>
                                        <div class="invalid-feedback" id="friction_dynamic_error"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 参数6：仿真终止时间 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-body">
                                        <label for="simulation_endtime" class="form-label">
                                            <i class="bi bi-clock-fill text-secondary"></i>
                                            <strong>仿真终止时间</strong>
                                        </label>
                                        <div class="input-group">
                                            <input type="number"
                                                   class="form-control"
                                                   id="simulation_endtime"
                                                   name="simulation_endtime"
                                                   value="30"
                                                   min="10"
                                                   max="100"
                                                   step="5"
                                                   required>
                                            <span class="input-group-text">µs</span>
                                        </div>
                                        <div class="form-text">
                                            推荐范围: 10-100 µs
                                        </div>
                                        <div class="invalid-feedback" id="simulation_endtime_error"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mb-4">
                            <button type="button" class="btn btn-outline-secondary" id="resetBtn">
                                <i class="bi bi-arrow-counterclockwise"></i> 重置
                            </button>
                            <button type="button" class="btn btn-primary" id="validateBtn">
                                <i class="bi bi-check-circle"></i> 验证参数
                            </button>
                            <button type="submit" class="btn btn-success" id="generateBtn">
                                <i class="bi bi-file-earmark-arrow-down"></i> 生成K文件
                            </button>
                        </div>
                    </form>

                    <!-- 生成历史 -->
                    <hr class="my-5">

                    <h3 class="mb-3">
                        <i class="bi bi-clock-history"></i>
                        生成历史
                    </h3>

                    <div class="table-responsive">
                        <table class="table table-hover" id="historyTable">
                            <thead class="table-light">
                                <tr>
                                    <th>生成时间</th>
                                    <th>速度(m/s)</th>
                                    <th>弹丸(MPa)</th>
                                    <th>靶板(MPa)</th>
                                    <th>静摩擦</th>
                                    <th>时间(µs)</th>
                                    <th>文件大小</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr>
                                    <td colspan="8" class="text-center text-muted">
                                        暂无生成记录
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody">
                消息内容
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 应用脚本 -->
    <script src="app.js"></script>
</body>
</html>
